version: '3.8'

services:
  discord-bot:
    build: .
    container_name: event-planner-bot
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./.env

  db:
    image: mariadb
    restart: always
    env_file:
      - ./.env
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword123
      MARIADB_DATABASE: event-planner

    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
